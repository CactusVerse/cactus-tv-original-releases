name: Diagnosticar etapa asset reproductor webOS 3
on:
  push:
    paths:
      - ".github/workflows/diagnosticar-lg-asset.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - name: Inspeccionar cliente de playback del IPK
        run: |
          curl -fL --retry 3 --retry-delay 3 \
            https://github.com/CactusVerse/cactus-tv-original-releases/releases/download/lg-webos3-lh6000-hd-2.0.14-test/CactusTV_LG_2.0.14_webOS3_LH6000_HD.ipk -o base.ipk
          python3 - <<'PY'
          import tarfile,io,pathlib,re
          raw=pathlib.Path('base.ipk').read_bytes();pos=8
          while pos<len(raw):
            h=raw[pos:pos+60];l=int(h[48:58]);n=h[:16].decode().strip().rstrip('/');b=raw[pos+60:pos+60+l];pos+=60+l+l%2
            if n=='data.tar.gz':break
          with tarfile.open(fileobj=io.BytesIO(b),mode='r:gz') as z:
            files={m.name.split('/')[-1]:z.extractfile(m).read().decode('utf-8','replace') for m in z if m.isfile() and m.name.endswith('.js') and m.name.split('/')[-1] in ('playback-controls.js','playback-support.js','background-client.js','direct-compat.js','direct-media.js','direct-media.js','playback-service.js')}
          for n in ('playback-controls.js','playback-support.js','background-client.js','direct-compat.js','direct-media.js'):
            if n not in files:continue
            s=files[n];print('\n###### '+n+' ######')
            if n=='playback-controls.js':
              for token in ['function begin(', 'function start(', 'function fail(', 'function present(', 'resolve(', 'asset', 'onerror', 'CACTUS_PLAYBACK']:
                for m in list(re.finditer(re.escape(token),s))[:4]:
                  print(token,repr(s[max(0,m.start()-230):min(len(s),m.start()+1800)]))
            elif n=='direct-media.js':
              for token in ['function request(', 'function open(', 'function fail(', "s.phase='asset'", 'AbortController', 'function h264(']:
                for m in list(re.finditer(re.escape(token),s))[:2]:
                  print(token,repr(s[max(0,m.start()-160):min(len(s),m.start()+1600)]))
            else:
              print(s[:10000])
          PY
