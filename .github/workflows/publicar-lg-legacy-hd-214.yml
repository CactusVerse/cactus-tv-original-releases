name: Publicar LG Legacy HD 2.0.14 (webOS 3)
on:
  push:
    paths:
      - ".github/workflows/publicar-lg-legacy-hd-214.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  empaquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar base LG 2.0.12 verificada
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/CactusVerse/cactus-tv-original-releases/releases/download/lg-2.0.12-r9-beta/CactusTV_LG_Beta_2.0.12.ipk \
            -o origen.ipk
          echo "20216ead1c0fc798dc2f88519eda5c9e3f007c5e4320a654b76d71aeb782fbcd  origen.ipk" | sha256sum -c -
      - name: Generar variante HD 1280x720
        run: |
          python3 scripts/build-lg-webos3-lh6000-hd.py
          dpkg-deb --info CactusTV_LG_2.0.14_webOS3_LH6000_HD.ipk
          python3 - <<'PY'
          import io,json,pathlib,tarfile,subprocess
          b=pathlib.Path('CactusTV_LG_2.0.14_webOS3_LH6000_HD.ipk').read_bytes()
          pos=8
          while pos<len(b):
              h=b[pos:pos+60];n=h[:16].decode().strip().rstrip('/');size=int(h[48:58]);v=b[pos+60:pos+60+size];pos+=60+size+size%2
              if n!='data.tar.gz':continue
              with tarfile.open(fileobj=io.BytesIO(v),mode='r:gz') as t:
                  files={m.name:t.extractfile(m).read() for m in t if m.isfile()}
              break
          root='usr/palm/applications/com.cocotecnico.cactustv.lgtest/'
          appinfo=json.loads(files[root+'appinfo.json'])
          assert appinfo['resolution']=='1280x720',appinfo
          assert appinfo['version']=='2.0.14'
          css=files[root+'index.html'].decode()
          assert 'inset:0' not in css
          assert 'top:0;right:0;bottom:0;left:0;' in css
          assert 'overflow:hidden' in css
          for n,content in files.items():
              if n.endswith(('/launcher.js','/webos-child.js','/webos3-preflight.js')):
                  subprocess.run(['node','--check','-'],input=content,check=True)
                  print('Sintaxis OK:',n)
          print('OK: resolución HD, CSS clásico, empaquetado, JavaScript')
          PY
          sha256sum CactusTV_LG_2.0.14_webOS3_LH6000_HD.ipk > SHA256SUMS-LG-Legacy-HD.txt
      - name: Publicar prueba independiente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="lg-webos3-lh6000-hd-2.0.14-test"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" CactusTV_LG_2.0.14_webOS3_LH6000_HD.ipk SHA256SUMS-LG-Legacy-HD.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" CactusTV_LG_2.0.14_webOS3_LH6000_HD.ipk SHA256SUMS-LG-Legacy-HD.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "Cactus TV LG Legacy HD 2.0.14 - LH6000 prueba 720p" \
              --notes "Prueba específica para LG LH6000 y otros televisores Full HD con webOS 3 / Chromium 38 en los que la interfaz queda atascada en una esquina. En appinfo.json establece resolución gráfica 1280x720 y en launcher reemplaza la propiedad CSS inset (no soportada en Chromium 38) por top/right/bottom/left explícitos. Conserva servicio y catálogo de 2.0.12. Probada estructuralmente, todavía NO confirmada en la LH6000 afectada. La LG Legacy 2.0.13 anterior permanece disponible." \
              --prerelease \
              --latest=false
          fi
