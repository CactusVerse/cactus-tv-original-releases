name: Verificar carga CryptoJS MD5 LG 3
on:
  push:
    paths:
      - ".github/workflows/verificar-md5-lg3-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar IPK original verificado
        run: |
          curl -fL --retry 4 --retry-delay 2 \
            https://github.com/CactusVerse/cactus-tv-original-releases/releases/download/lg-legacy-hd-2.0.17-crypto-compat/CactusTV_LG_Legacy_HD_2.0.17_Crypto_Compat.ipk -o base.ipk
          echo "cb569d616c694be475bae66e4dabc8238f73c2ea21297db8fc06d9c349268c76  base.ipk" | sha256sum -c -
      - name: Revisar orden carga en iframe y worker
        run: |
          python3 - <<'PY'
          import tarfile,io,pathlib,re
          b=pathlib.Path('base.ipk').read_bytes();p=8
          while p<len(b):
            h=b[p:p+60];s=int(h[48:58]);n=h[:16].decode().strip().rstrip('/');x=b[p+60:p+60+s];p+=60+s+s%2
            if n=='data.tar.gz':break
          with tarfile.open(fileobj=io.BytesIO(x),mode='r:gz') as t:
            fs={m.name:t.extractfile(m).read().decode('utf-8','replace') for m in t if m.isfile() and m.name.endswith(('.js','.html'))}
          for n,s in fs.items():
            if n.endswith('/provider-worker.js') or n.endswith('/background-client.js') or n.endswith('/index.html') and '/backend/app/' in n:
              print('\n=== '+n+' ===')
              if n.endswith('index.html'):
                for ln in s.splitlines():
                  if 'script ' in ln:print(ln)
              else:
                print(s[:9500])
          PY
