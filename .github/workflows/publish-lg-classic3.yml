name: Publish Cactus TV LG Clasico 3.0.0
on:
  push:
    branches: ["classic/lg-3.0.0-base120"]
    paths: [".github/workflows/publish-lg-classic3.yml"]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified shared runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download 43082933638 --repo "$GITHUB_REPOSITORY" --name CactusTV-LG-2.0.38-Busqueda-Fluida --dir base
      - name: Reassemble and verify installer file by file
        run: python3 classic3/publish-package.py 2>&1 | tee classic3-publication.log
      - name: Publish downloadable beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create lg-clasico-3.0.0-beta dist/*.ipk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "Cactus TV LG Clásico 3.0.0 beta" --prerelease --latest=false --notes "Edición independiente basada en Desierto 1.2.0. Para LG webOS 4 ARMv7; compatibilidad según modelo. Mantiene el núcleo heredado de esa edición. Sin la credencial TMDB incorporada: configura tu propia API Key v3 desde Mi cuenta TMDB. Paquete verificado por integridad de archivos; fluidez y carátulas aún pendientes de validación en TV. No sustituye las ediciones LG modernas."
      - name: Save publication result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import os,pathlib,json
          p=pathlib.Path('classic3-publication.log')
          pathlib.Path('classic3-publication-result.json').write_text(json.dumps({'status':os.environ['RESULT'],'run_id':os.environ['GITHUB_RUN_ID'],'log':p.read_text()[-10000:] if p.exists() else ''}))
          PY
          git config user.name "Cactus publication"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classic3-publication-result.json
          git commit -m "Record Classic 3.0.0 publication result"
          git push origin HEAD:classic/lg-3.0.0-base120
