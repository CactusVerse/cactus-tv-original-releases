name: Diagnóstico MD5 webOS 3.0 (LG Legacy)
on:
  push:
    paths:
      - ".github/workflows/inspeccionar-lg-md5-217.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar beta 2.0.17 verificada
        run: |
          curl -fL --retry 4 --retry-delay 2 \
            https://github.com/CactusVerse/cactus-tv-original-releases/releases/download/lg-legacy-hd-2.0.17-crypto-compat/CactusTV_LG_Legacy_HD_2.0.17_Crypto_Compat.ipk -o base.ipk
          echo "cb569d616c694be475bae66e4dabc8238f73c2ea21297db8fc06d9c349268c76  base.ipk" | sha256sum -c -
      - name: Inspeccionar módulo de identidad y MD5
        run: |
          python3 - <<'PY'
          import tarfile, io, pathlib, re
          blob=pathlib.Path('base.ipk').read_bytes(); pos=8
          while pos<len(blob):
            h=blob[pos:pos+60]; sz=int(h[48:58]); name=h[:16].decode().strip().rstrip('/')
            raw=blob[pos+60:pos+60+sz]; pos+=60+sz+sz%2
            if name=='data.tar.gz': break
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as t:
            files={m.name:t.extractfile(m).read().decode('utf-8','replace') for m in t if m.isfile() and m.name.endswith('.js')}
          for n in sorted(files):
            if n.endswith('/xuper/device.js'):
              print('=== DEVICE.JS ===')
              print(files[n])
            elif n.endswith('/xuper/crypto3des.js'):
              print('=== CRYPTO3DES.JS (first 6000) ===')
              print(files[n][:6000])
            elif n.endswith('/xuper/md5.js'):
              print('=== XUPER MD5.JS ===')
              print(files[n][:5000])
          print('=== MATCHES MD5 ===')
          for n,code in sorted(files.items()):
            if n.endswith('hls.min.js'):continue
            mm=list(re.finditer(r'\bMD5\b|\bmd5\b|\.digest\s*\(|crypto\.subtle|XuperDevice',code,re.I))
            if mm:
              print('FILE',n,'length',len(code),'matches',len(mm))
              for m in mm[:8]:
                print('  ',repr(code[max(0,m.start()-180):m.end()+310]))
          PY
