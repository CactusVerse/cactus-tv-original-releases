name: Diagnosticar reproductor LG webOS3 P01
on:
  push:
    paths:
      - ".github/workflows/diagnosticar-lg-p01.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar LG Legacy HD publicado
        run: |
          curl -fL --retry 3 --retry-delay 3 \
            https://github.com/CactusVerse/cactus-tv-original-releases/releases/download/lg-webos3-lh6000-hd-2.0.14-test/CactusTV_LG_2.0.14_webOS3_LH6000_HD.ipk \
            -o base.ipk
          echo "c4f58b63be19787a97d1b9ae6f220027c5c90fb0866a550600c2f3570f1421bc  base.ipk" | sha256sum -c -
      - name: Analizar código de reproducción
        run: |
          python3 - <<'PY'
          import pathlib,tarfile,io,re
          raw=pathlib.Path('base.ipk').read_bytes();pos=8
          while pos<len(raw):
            head=raw[pos:pos+60];length=int(head[48:58]);name=head[:16].decode().strip().rstrip('/')
            data=raw[pos+60:pos+60+length];pos+=60+length+length%2
            if name=='data.tar.gz':break
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as t:
            files={m.name:t.extractfile(m).read().decode('utf-8','replace') for m in t if m.isfile() and (m.name.endswith('.js') or m.name.endswith('.html'))}
          print('Total JS/HTML',len(files))
          pattern=re.compile(r'P01|asset/|TypeError|No se pudo iniciar esta fuente|mediaOption|video\.src|video\.load|createObjectURL|\.m3u8|play\(\)',re.I)
          for name,content in files.items():
            matches=list(pattern.finditer(content))
            if not matches:continue
            print('\nFILE',name, 'LENGTH',len(content),'MATCHES',len(matches))
            for m in matches[:25]:
              txt=content[max(0,m.start()-230):min(len(content),m.end()+360)]
              print('CONTEXT',repr(txt[:680]))
          PY
